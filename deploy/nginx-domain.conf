# 蚝历 · 正式域名切换后的 nginx 配置（v1.68 / 2026-11-17）
# 目标路径：/etc/nginx/nginx.conf（服务器原配置已备份为 nginx.conf.bak-20261117）
#
# 结构要点：
#   1. 80 端口统一 301 到 https，$host 原样保留，裸 IP 与域名都适用；
#   2. 443 新增 oyster111.top / www 的 server 块；
#   3. **保留裸 IP 的 default_server + IP SAN 证书** —— 1.67 及更早的 App 内置
#      https://49.233.147.15，砍掉它老用户主源会 TLS 校验失败（只能回落 jsDelivr）；
#   4. 2026-11-17 DNS 生效后已用
#      certbot certonly --nginx --cert-name oyster111.top -d oyster111.top -d www.oyster111.top
#      签发独立域名证书（不能用 --expand，否则会覆盖 haoli-ip 的 IP SAN 证书），
#      域名块证书路径已切到 /etc/letsencrypt/live/oyster111.top/...；
#      自动续期由 certbot timer 托管。
#
# 证书运维（2026-11-17 实测）：
#   · 域名证书：certbot 签发，90 天（到 2027-02-15），authenticator=nginx；
#   · IP 证书：6 天短期（shortlived profile），必须用 certbot ≥5.4 的
#     --ip-address 申请（系统 /usr/bin/certbot 2.8 与 /opt/certbot 5.9 均不支持
#     续期旧格式配置，报 "domains or ipaddrs need to be not empty"）。
#     已装 /opt/certbot-new（5.10.0，pip 源 tuna），webroot + IP 方式重签，
#     并加 deploy-hook `systemctl reload nginx`；
#   · 续期服务 /etc/systemd/system/certbot-haoli.service 的 ExecStart 已指向
#     /opt/certbot-new/bin/certbot，timer 每天 03:17 / 15:17 各跑一次，
#     两张证书 dry-run 均 success；旧 service 备份为 .bak-20261117。
#   · nginx 配置里两个 server 块证书路径各自独立，重签不会串台。

user root;
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  map $time_iso8601 $haoli_year { default /2026/; "~^2027-" /2027/; "~^2028-" /2028/; }

  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
    root /var/www/haoli;
    index index.html;
    location ~* \.ics$ { default_type text/calendar; add_header Content-Disposition inline; add_header Cache-Control "public, max-age=3600"; }
    location = / { add_header Cache-Control "no-store"; try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
  }

  # 正式域名块：证书为 oyster111.top 专用域名证书（2026-11-17 签发，2027-02-15 到期）。
  server {
    listen 443 ssl;
    server_name oyster111.top www.oyster111.top;
    root /var/www/haoli;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/oyster111.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oyster111.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    location = / { add_header Cache-Control "no-store"; try_files /index.html =404; }
    location ~* \.ics$ { default_type text/calendar; add_header Content-Disposition inline; add_header Cache-Control "public, max-age=3600"; add_header Access-Control-Allow-Origin "*"; }
    location ~* \.(png|jpg|svg|ico)$ { expires 7d; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; expires off; }
    location ~* \.(xml|txt)$ { expires 1h; }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options "nosniff" always;
  }

  # 裸 IP 兜底：1.67 及更早 App 的主源，必须保留
  server {
    listen 443 ssl default_server;
    server_name _;
    root /var/www/haoli;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/haoli-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haoli-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    location = / { add_header Cache-Control "no-store"; try_files /index.html =404; }
    location ~* \.ics$ { default_type text/calendar; add_header Content-Disposition inline; add_header Cache-Control "public, max-age=3600"; add_header Access-Control-Allow-Origin "*"; }
    location ~* \.(png|jpg|svg|ico)$ { expires 7d; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; expires off; }
    location ~* \.(xml|txt)$ { expires 1h; }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options "nosniff" always;
  }
}
