# 蚝历 · 节假日日历 · Nginx 站点配置
# 放到 /etc/nginx/conf.d/haoli.conf，root 指向站点根目录（含 index.html 与 ics/）。
# 注意：一个 server 块里同类 location 只能出现一次，正则 location 重复会让 nginx 启动失败。

server {
    listen 80;
    server_name holiday.example.com;   # ← 改成你的域名

    root /var/www/haoli;
    index index.html;

    charset utf-8;

    # 根路径：交给站点根目录的 index.html，由它按访客本机时间跳到「最新已发布年份」。
    # 以前这里是 `return 302 /2026/`（或按服务器时间 map 到固定年份），跨年后会停在旧年，
    # 且每发布一年都得改配置。改成静态跳转页后，加一个年份目录即可生效，不用动 nginx。
    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # 页面
    location / {
        try_files $uri $uri/ =404;
    }

    # .ics：交给日历客户端读取，不强制下载
    # Content-Disposition 若写成 attachment，iOS 会存成文件而无法直接「添加到日历」，
    # 所以这里用默认 inline，页面上用 download 属性控制下载行为。
    location ~* \.ics$ {
        types { }
        default_type text/calendar; charset=utf-8;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.(png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(html|xml|txt)$ {
        expires 1h;
    }

    gzip on;
    gzip_types text/calendar text/html text/plain application/xml text/css application/javascript;
    gzip_min_length 512;

    # 缓存/安全
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/haoli.access.log;
    error_log  /var/log/nginx/haoli.error.log;
}
