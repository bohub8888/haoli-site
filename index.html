<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>蚝历 · 节假日日历</title>
<script>
/*
 * 根路径只做一件事：把访客送到「当前年份」的页面。
 * 年份不在配置里写死——按访客本机时间取当年，再逐个探测该年目录是否已发布，
 * 没发布就退一年。这样 1 月 1 日自动换新页，也不会因为某年没建目录而 404。
 */
(function () {
  var MIN_YEAR = 2026;          // 最早发布的年份
  var start = new Date().getFullYear();

  function fallback() {
    var box = document.getElementById('pick');
    if (box) box.style.display = 'block';
  }

  function probe(y) {
    if (y < MIN_YEAR) { fallback(); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('HEAD', '/' + y + '/', true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 400) {
        location.replace('/' + y + '/');
      } else {
        probe(y - 1);
      }
    };
    xhr.send();
  }

  window.addEventListener('DOMContentLoaded', function () { probe(start); });
})();
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f1014; color: #e8e8ee; padding: 24px;
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .box { width: 100%; max-width: 360px; text-align: center; }
  .logo { font-size: 30px; letter-spacing: 4px; margin-bottom: 6px; }
  .sub { color: #7d7d88; font-size: 13px; margin-bottom: 22px; }
  .spin {
    width: 26px; height: 26px; margin: 0 auto 18px; border-radius: 50%;
    border: 2px solid #2a2c34; border-top-color: #ff6b35; animation: r .9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  #pick { display: none; }
  #pick a {
    display: block; margin: 8px 0; padding: 12px; border-radius: 10px;
    background: #1a1c22; color: #e8e8ee; text-decoration: none; border: 1px solid #2a2c34;
  }
  #pick a:hover { border-color: #ff6b35; color: #ff6b35; }
  .tip { color: #5f5f6a; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">蚝历</div>
    <div class="sub">节假日日历 · 正在打开今年的日历…</div>
    <div class="spin"></div>
    <div id="pick">
      <a href="/2027/">2027 年节假日日历</a>
      <a href="/2026/">2026 年节假日日历</a>
      <div class="tip">没自动跳转的话，点上面的年份。</div>
    </div>
    <noscript>
      <div style="margin-top:16px">
        <a href="/2027/" style="color:#ff6b35">2027 年</a> ·
        <a href="/2026/" style="color:#ff6b35">2026 年</a>
      </div>
    </noscript>
  </div>
</body>
</html>
